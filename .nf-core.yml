template:
  org: eduatilab
  name: spotlight
  description:
    Computational framework (SPoTLIghT) to derive spatial graph-based interpretable
    features from H&E (fresh-frozen, FF) tissue slides.
  author: Joan Kant
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github
    - ci
    - igenomes
    - nf_core_configs
    - code_linters
    - gitpod
    - codespaces
    - multiqc
    - fastqc
    - changelog
    - email
    - adaptivecard
    - slackreport
    - test_config
    - seqera_platform
  is_nfcore: false
